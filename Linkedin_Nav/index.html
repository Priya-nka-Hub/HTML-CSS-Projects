<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <title>Linkedin Navbar</title>
</head>
<body>

    <header>
        <nav>
            <div class="nav-left">
              <div class="logo">
                <img src="https://img.freepik.com/premium-vector/vinnytsia-ukraine-april-29-2023-popular-social-media-logo-icon-linkedin-vector-design-realistic-editorial-sign_545793-1682.jpg" alt="">
              </div>
              <div class="nav-search">
                 <div class="search-icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                 </div>
                 <input type="text" placeholder="Search">
              </div>
            </div>

            <div class="nav-right">

                <div class="nav-menus">
                    <i class="fa-solid fa-house"></i>
                    <p>Home</p>
                </div>

                <div class="nav-menus">
                    <i class="fa-solid fa-user-group"></i>
                    <p>My Network</p>
                </div>

                <div class="nav-menus">
                    <i class="fa-solid fa-briefcase"></i>
                    <p>Job</p>
                </div>

                <div class="nav-menus">
                    <i class="fa-solid fa-message"></i>
                    <p>Messaging</p>
                </div>
                <div class="nav-menus">
                    <i class="fa-solid fa-bell"></i>
                    <p>Notification</p>
                </div>

                <div class="nav-menus">
                    <i class="fa-solid fa-user"></i>
                    <p>Me <i class="fa-solid fa-caret-down"></i> </p>
                </div>
                <div class="nav-menus">
                    <img src="https://www.svgrepo.com/show/174444/square-menu.svg" alt="">
                    <p>For Business <i class="fa-solid fa-caret-down"></i></p>
                </div>

                <a href="">Try Premium for Rs. 0</a>

            </div>
        </nav>
    </header>
    
</body>
</html>
