<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <header>
        <nav>
            <div class="nav-logo">
              <h1>LOGO</h1>
            </div>

            <div class="nav-links">
              <ul class="nav-menu" id="menu">
                <li>Home</li>
                <li>About Us</li>
                <li>Products</li>
                <li>Services</li>
                <li>Contact Us</li>
               
              </ul>
            </div>

            <div class="nav-login">
                <img src="login.jpg" alt="">
                 <button>Login</button>
                 <button>Register</button>
                 <i class="fa-solid fa-bars" onclick="openMenu()" id="menuIcon"></i>
                 <i class="fa-solid fa-circle-xmark" onclick="closeMenu()" id="closeIcon"></i>
            </div>
           
        </nav>
    </header>
    

    <script>
        let x = document.getElementById('menu');
        let mIcon = document.getElementById('menuIcon');
        let cIcon = document.getElementById('closeIcon');


        function openMenu(){
            x.style.display = 'block';
            cIcon.style.display = 'block';
            mIcon.style.display = 'none';
        }
        function closeMenu(){
            x.style.display = 'none';
            cIcon.style.display = 'none';
            mIcon.style.display = 'block';
        }
    </script>
</body>
</html>
